<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Enterprise - Plataforma Dinámica de Códigos QR</title>
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <style>
    :root {
      --bg-page: #0b0f19;
      --panel-bg: #111827;
      --card-bg: #1f2937;
      --accent: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border: #374151;
      --radius: 12px;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      padding: 24px;
      box-sizing: border-box;
      min-height: 100vh;
    }

    .navbar {
      max-width: 1280px;
      margin: 0 auto 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: var(--accent-gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .badge-pro {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.3);
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .layout {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 24px;
    }

    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 16px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.9rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .preview-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      position: sticky;
      top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .qr-box {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      margin: 20px 0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: white;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }

    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #374151;
    }

    .redirect-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 80vh;
      text-align: center;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Vista de Redirección Automática -->
  <div id="redirect-view" class="redirect-screen" style="display: none;">
    <div class="spinner"></div>
    <h2 id="redirect-status">Redirigiendo a tu destino corporativo...</h2>
  </div>

  <!-- Vista Principal del Generador -->
  <div id="app-view">
    <div class="navbar">
      <div class="brand">
        <div class="brand-icon">QR</div>
        <div>
          <h2 style="margin: 0; font-size: 1.2rem;">Plataforma QR Empresarial</h2>
          <span style="font-size: 0.8rem; color: var(--text-muted);">Gestor de Códigos Dinámicos y Estáticos</span>
        </div>
      </div>
      <span class="badge-pro">MODO SEGURIDAD ACTIVO</span>
    </div>

    <div class="layout">
      <!-- PANEL DE CONFIGURACIÓN -->
      <div class="panel">
        
        <div class="section-title">1. Configuración del Enlace</div>
        <div class="form-group">
          <label>Tipo de Código QR</label>
          <select id="qr-type" onchange="toggleType(); updateQR();">
            <option value="dynamic" selected>QR Dinámico (Administrable / Editables)</option>
            <option value="static">QR Estático (Enlace Fijo)</option>
          </select>
        </div>

        <div class="form-group">
          <label>URL de Destino Final *</label>
          <input type="url" id="target-url" value="https://oscardavidmanciarivera-create.github.io/Genera-tu-QR/" oninput="updateQR()">
        </div>

        <div id="dynamic-group">
          <div class="form-group">
            <label>ID del QR Dinámico</label>
            <input type="text" id="qr-id" oninput="updateQR()">
          </div>

          <div class="form-group">
            <label>Clave de Administración Secreta *</label>
            <input type="password" id="admin-key" placeholder="Pega tu clave secreta configurada en Apps Script">
          </div>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">

        <div class="section-title">2. Personalización Visual</div>
        
        <div class="grid-2 form-group">
          <div>
            <label>Color Principal</label>
            <input type="color" id="color-dots" value="#2563eb" style="height: 42px; cursor: pointer;" onchange="updateQR()">
          </div>
          <div>
            <label>Color de Fondo</label>
            <input type="color" id="color-bg" value="#ffffff" style="height: 42px; cursor: pointer;" onchange="updateQR()">
          </div>
        </div>

        <div class="grid-2 form-group">
          <div>
            <label>Estilo de Puntos</label>
            <select id="dots-style" onchange="updateQR()">
              <option value="rounded" selected>Redondeado</option>
              <option value="dots">Círculos</option>
              <option value="square">Cuadrado</option>
              <option value="classy">Elegante</option>
            </select>
          </div>
          <div>
            <label>Estilo de Esquinas</label>
            <select id="corner-style" onchange="updateQR()">
              <option value="extra-rounded" selected>Curva Suave</option>
              <option value="square">Cuadrado</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Subir Logo de Empresa (PNG / JPG)</label>
          <input type="file" id="logo-input" accept="image/*" onchange="handleLogo(event)">
        </div>

      </div>

      <!-- VISTA PREVIA Y ACCIONES -->
      <div class="preview-card">
        <h3 style="margin: 0; font-size: 1.1rem;">Vista Previa del QR</h3>
        <span style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;" id="encoded-info"></span>

        <div class="qr-box">
          <div id="qrcode"></div>
        </div>

        <button class="btn btn-primary" onclick="saveAndGenerate()">Guardar y Publicar QR</button>

        <div class="grid-2" style="width: 100%; margin-top: 12px;">
          <button class="btn btn-secondary" onclick="downloadQR('png')">Descargar PNG</button>
          <button class="btn btn-secondary" onclick="downloadQR('svg')">Descargar SVG</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const BASE_GITHUB_URL = "https://oscardavidmanciarivera-create.github.io/Genera-tu-QR/";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzFcu4eujBiIaz12G3bvQSV-p-LJmpNv81TWIMUY9NhTIDwJoT7CcVorExwRcnIpg-fuA/exec";
    
    let logoDataUrl = "";

    const qrCode = new QRCodeStyling({
      width: 240,
      height: 240,
      type: "svg",
      data: BASE_GITHUB_URL,
      dotsOptions: { color: "#2563eb", type: "rounded" },
      backgroundOptions: { color: "#ffffff" },
      cornersSquareOptions: { type: "extra-rounded" },
      cornersDotOptions: { type: "dot" }
    });

    qrCode.append(document.getElementById("qrcode"));

    // Generar ID único
    document.getElementById("qr-id").value = "corp_" + Math.random().toString(36).substring(2, 9);

    // Cargar clave guardada en el navegador si existe
    document.getElementById("admin-key").value = localStorage.getItem("corp_admin_key") || "";

    // Interceptar Redirección (?r=ID)
    window.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const qrId = urlParams.get("r");

      if (qrId) {
        document.getElementById("app-view").style.display = "none";
        document.getElementById("redirect-view").style.display = "flex";

        try {
          const response = await fetch(`${SCRIPT_URL}?action=get&id=${encodeURIComponent(qrId)}`);
          const data = await response.json();

          if (data.status === "success" && data.url) {
            window.location.replace(data.url);
          } else {
            document.getElementById("redirect-status").innerText = "Código QR no registrado o desactivado.";
          }
        } catch (err) {
          document.getElementById("redirect-status").innerText = "Error de conexión al servidor.";
        }
      } else {
        updateQR();
      }
    });

    function toggleType() {
      const type = document.getElementById("qr-type").value;
      document.getElementById("dynamic-group").style.display = type === "dynamic" ? "block" : "none";
    }

    function handleLogo(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          logoDataUrl = e.target.result;
          updateQR();
        };
        reader.readAsDataURL(file);
      }
    }

    function updateQR() {
      const type = document.getElementById("qr-type").value;
      const targetUrl = document.getElementById("target-url").value.trim();
      const qrId = document.getElementById("qr-id").value.trim();
      
      let finalData = targetUrl;
      if (type === "dynamic" && qrId) {
        finalData = `${BASE_GITHUB_URL}?r=${encodeURIComponent(qrId)}`;
      }

      document.getElementById("encoded-info").innerText = finalData;

      qrCode.update({
        data: finalData,
        dotsOptions: { color: document.getElementById("color-dots").value, type: document.getElementById("dots-style").value },
        backgroundOptions: { color: document.getElementById("color-bg").value },
        cornersSquareOptions: { type: document.getElementById("corner-style").value },
        image: logoDataUrl,
        imageOptions: { crossOrigin: "anonymous", margin: 4 }
      });
    }

    async function saveAndGenerate() {
      const type = document.getElementById("qr-type").value;
      const targetUrl = document.getElementById("target-url").value.trim();
      const qrId = document.getElementById("qr-id").value.trim();
      const adminKey = document.getElementById("admin-key").value.trim();

      updateQR();

      if (type === "dynamic") {
        if (!adminKey) return alert("Ingresa la clave de administración.");

        localStorage.setItem("corp_admin_key", adminKey);

        const endpoint = `${SCRIPT_URL}?action=save&id=${encodeURIComponent(qrId)}&url=${encodeURIComponent(targetUrl)}&key=${encodeURIComponent(adminKey)}`;

        try {
          const res = await fetch(endpoint);
          const data = await res.json();

          if (data.status === "success") {
            alert(`¡Éxito! El QR Dinámico "${qrId}" ha sido guardado exitosamente.`);
          } else {
            alert("Error: " + (data.message || "Clave incorrecta."));
          }
        } catch (e) {
          alert("Los datos fueron enviados a procesamiento.");
        }
      } else {
        alert("¡QR Estático listo!");
      }
    }

    function downloadQR(ext) {
      qrCode.download({ name: "qr-empresarial", extension: ext });
    }
  </script>
</body>
</html>
