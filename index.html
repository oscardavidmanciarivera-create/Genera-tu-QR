<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Craft PRO - Generador de Códigos QR</title>
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <style>
    :root {
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e2e8f0;
      --radius: 12px;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      padding: 24px;
    }

    .header {
      max-width: 1200px;
      margin: 0 auto 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background: var(--accent);
      color: white;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
    }

    /* Layout Principal de 2 Columnas */
    .dashboard {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .dashboard { grid-template-columns: 1fr; }
    }

    /* Panel de Opciones (Acordeón) */
    .panel {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    .accordion-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .accordion-header {
      width: 100%;
      padding: 14px 16px;
      background: #f1f5f9;
      border: none;
      text-align: left;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .accordion-content {
      padding: 16px;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    input, select, button {
      font-family: inherit;
    }

    input[type="text"], input[type="url"], select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      box-sizing: border-box;
      font-size: 0.9rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Panel de Vista Previa Fijo */
    .preview-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      position: sticky;
      top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .qr-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      border: 2px dashed var(--border);
      margin: 16px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 260px;
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      width: 100%;
      background: #e2e8f0;
      color: var(--text-main);
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <div class="brand-logo">QR</div>
      <div>
        <h2 style="margin: 0;">QR Craft PRO</h2>
        <span style="font-size: 0.8rem; color: var(--text-muted);">Generador Todo-en-Uno</span>
      </div>
    </div>
  </div>

  <div class="dashboard">

    <!-- LADO IZQUIERDO: OPCIONES TODAS EN UN SOLO LUGAR -->
    <div class="panel">
      
      <!-- Seccion 1: Contenido -->
      <div class="accordion-item">
        <div class="accordion-header">1. Contenido y Tipo de QR</div>
        <div class="accordion-content">
          <label>Tipo de Código QR</label>
          <select id="qr-type" onchange="toggleType()">
            <option value="dynamic" selected>Dinámico (Redireccionable con Google Sheets)</option>
            <option value="static">Estático (Enlace Directo)</option>
          </select>

          <label>URL de Destino Real *</label>
          <input type="url" id="target-url" value="https://oscardavidmanciarivera-create.github.io/Oscar-Mancia-blog/">

          <div id="dynamic-fields">
            <label>ID Único del QR</label>
            <input type="text" id="qr-id" placeholder="Ej: mi_qr_01">

            <label>URL de Google Apps Script (Backend)</label>
            <input type="text" id="script-url" placeholder="https://script.google.com/macros/s/.../exec">
          </div>
        </div>
      </div>

      <!-- Seccion 2: Colores y Puntos -->
      <div class="accordion-item">
        <div class="accordion-header">2. Colores y Estilo de Puntos</div>
        <div class="accordion-content">
          <div class="grid-2">
            <div>
              <label>Color Principal</label>
              <input type="color" id="color-dots" value="#0f172a" style="width:100%; height:40px; cursor:pointer;" onchange="updateQR()">
            </div>
            <div>
              <label>Color Fondo</label>
              <input type="color" id="color-bg" value="#ffffff" style="width:100%; height:40px; cursor:pointer;" onchange="updateQR()">
            </div>
          </div>

          <label>Estilo de Módulos (Puntos)</label>
          <select id="dots-style" onchange="updateQR()">
            <option value="square">Cuadrado</option>
            <option value="dots">Puntos Redondos</option>
            <option value="rounded" selected>Redondeado</option>
            <option value="classy">Elegante</option>
            <option value="extra-rounded">Suave</option>
          </select>
        </div>
      </div>

      <!-- Seccion 3: Esquinas -->
      <div class="accordion-item">
        <div class="accordion-header">3. Marcos y Esquinas</div>
        <div class="accordion-content">
          <label>Marco Exterior (Eye Frame)</label>
          <select id="corner-square" onchange="updateQR()">
            <option value="square">Cuadrado</option>
            <option value="extra-rounded" selected>Redondeado</option>
          </select>

          <label>Centro Interior (Eye Ball)</label>
          <select id="corner-dot" onchange="updateQR()">
            <option value="square">Cuadrado</option>
            <option value="dot" selected>Círculo</option>
          </select>
        </div>
      </div>

      <!-- Seccion 4: Logo -->
      <div class="accordion-item">
        <div class="accordion-header">4. Logo Central y Calidad</div>
        <div class="accordion-content">
          <label>Subir Logo (PNG / JPG)</label>
          <input type="file" id="logo-input" accept="image/*" onchange="handleLogo(event)">

          <label>Corrección de Errores (ECC)</label>
          <select id="ecc-level" onchange="updateQR()">
            <option value="L">L - Bajo (7%)</option>
            <option value="M">M - Medio (15%)</option>
            <option value="Q" selected>Q - Alto (25%)</option>
            <option value="H">H - Máximo (30%)</option>
          </select>
        </div>
      </div>

    </div>

    <!-- LADO DERECHO: VISTA PREVIA SIEMPRE VISIBLE -->
    <div class="preview-card">
      <h3 style="margin: 0;">Vista Previa</h3>
      
      <div class="qr-container">
        <div id="qrcode"></div>
      </div>

      <button class="btn-primary" onclick="saveAndGenerate()">Guardar y Generar QR</button>
      
      <div class="grid-2" style="width: 100%; margin-top: 8px;">
        <button class="btn-secondary" onclick="downloadQR('png')">Descargar PNG</button>
        <button class="btn-secondary" onclick="downloadQR('svg')">Descargar SVG</button>
      </div>
    </div>

  </div>

  <script>
    const BASE_GITHUB_URL = "https://oscardavidmanciarivera-create.github.io/Oscar-Mancia-blog/";
    let logoDataUrl = "";

    const qrCode = new QRCodeStyling({
      width: 240,
      height: 240,
      type: "svg",
      data: BASE_GITHUB_URL,
      dotsOptions: { color: "#0f172a", type: "rounded" },
      backgroundOptions: { color: "#ffffff" },
      cornersSquareOptions: { type: "extra-rounded" },
      cornersDotOptions: { type: "dot" }
    });

    qrCode.append(document.getElementById("qrcode"));

    // Autocompletar datos guardados
    document.getElementById("script-url").value = localStorage.getItem("script_url") || "";
    document.getElementById("qr-id").value = "qr_" + Math.random().toString(36).substring(2, 7);

    function toggleType() {
      const type = document.getElementById("qr-type").value;
      document.getElementById("dynamic-fields").style.display = type === "dynamic" ? "block" : "none";
    }

    function handleLogo(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          logoDataUrl = e.target.result;
          updateQR();
        };
        reader.readAsDataURL(file);
      }
    }

    function updateQR() {
      const type = document.getElementById("qr-type").value;
      const targetUrl = document.getElementById("target-url").value.trim();
      const qrId = document.getElementById("qr-id").value.trim();
      
      let finalData = targetUrl;
      if (type === "dynamic" && qrId) {
        finalData = `${BASE_GITHUB_URL}?r=${encodeURIComponent(qrId)}`;
      }

      qrCode.update({
        data: finalData,
        dotsOptions: { color: document.getElementById("color-dots").value, type: document.getElementById("dots-style").value },
        backgroundOptions: { color: document.getElementById("color-bg").value },
        cornersSquareOptions: { type: document.getElementById("corner-square").value },
        cornersDotOptions: { type: document.getElementById("corner-dot").value },
        qrOptions: { errorCorrectionLevel: document.getElementById("ecc-level").value },
        image: logoDataUrl,
        imageOptions: { crossOrigin: "anonymous", margin: 4 }
      });
    }

    async function saveAndGenerate() {
      const type = document.getElementById("qr-type").value;
      const targetUrl = document.getElementById("target-url").value.trim();
      const qrId = document.getElementById("qr-id").value.trim();
      const scriptUrl = document.getElementById("script-url").value.trim();

      if (scriptUrl) localStorage.setItem("script_url", scriptUrl);

      updateQR();

      if (type === "dynamic") {
        if (!scriptUrl) return alert("Ingresa la URL de tu Google Apps Script.");
        try {
          await fetch(`${scriptUrl}?action=save&id=${encodeURIComponent(qrId)}&url=${encodeURIComponent(targetUrl)}`, { mode: 'no-cors' });
          alert("¡QR Dinámico guardado exitosamente en tu Google Sheet!");
        } catch (e) {
          alert("Error al conectar con Google Sheets.");
        }
      } else {
        alert("¡QR Estático listo!");
      }
    }

    function downloadQR(ext) {
      qrCode.download({ name: "codigo-qr", extension: ext });
    }
  </script>

</body>
</html>
